<!--AH 6th CSS Styling with Color-->

<!DOCTYPE html>
<html>
<head>
<style>
.box{
  width:150px;
  height:150px;
  display:inline-block;
  text-align: center;
  line-height:150px;
  font-weight: bold;
  color: white;
}
.comp{background:red; border:3px solid green;}
.ana{background:lightgreen; border:3px solid green;}
.tri{background:blue; border:3px solid red;}
</style>
</head>
<body>
<div class="box comp">Complementary</div>
<div class="box ana">Analogous</div>
<div class="box tri">Triadic</div>
</body>
</html>
